# ---------------------------------------------------------------------------
# Automotive spare parts price forecasting - POC configuration
#
# Every tunable lives here. Modules take a Config object; no magic numbers are
# embedded in the code itself.
# ---------------------------------------------------------------------------

project:
  name: automotive-parts-price-forecasting
  random_seed: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  reports: reports
  figures: reports/figures
  models: models

# --- Real-data anchor -------------------------------------------------------
# BLS public API v1 needs no registration key. CUUR0000SETC is the CPI for
# "Motor Vehicle Parts and Equipment" (US city average, not seasonally
# adjusted, 1982-84=100) - the closest real, monthly, publicly available price
# signal for this domain.
sourcing:
  bls_api_base: https://api.bls.gov/publicAPI/v1/timeseries/data
  series_id: CUUR0000SETC
  fallback_series_id: WPU141101      # PPI motor vehicle parts, used if primary is empty
  request_timeout_seconds: 45
  cache_ttl_days: 7
  # If the live fetch fails entirely we synthesise this trend so the pipeline
  # still runs offline. Annualised drift, applied monthly in log space.
  offline_annual_inflation: 0.035

# --- Geopolitical mediators & event calendar --------------------------------
# Geopolitics is modelled as an upstream layer: events and GPR move FX,
# freight, commodities and duty; those mediators x exposure reach part price.
# See src/price_forecasting/geo_schema.py for the shared vocabulary.
geo:
  enabled: true
  cache_ttl_days: 7
  events_filename: geo_events.csv
  gpr_url: https://www.matteoiacoviello.com/gpr_files/data_gpr_export.xls
  # World Bank rotates the Pink Sheet doc hash monthly; discover from the
  # commodity-markets page when this URL 404s.
  pink_sheet_url: https://thedocs.worldbank.org/en/doc/74e8be41ceb20fa0da750cda2f6b9e4e-0050012026/related/CMO-Historical-Data-Monthly.xlsx
  pink_sheet_discover_url: https://www.worldbank.org/en/research/commodity-markets
  # Freight: drop a CSV (month,value) or set freight_url to a CSV endpoint.
  # Empty URL tries FRED Transportation Services Index: Freight (TSIFRGHT), then offline.
  freight_filename: freight_monthly.csv
  freight_url: ""
  # Sparse feature mode: keep mediators + exposure interactions that identify
  # cross-sectionally and drop the near-duplicate lag ladder. Evaluation shows
  # this costs nothing in holdout MAPE against the 107-feature 'full' set while
  # leaving 30 individually interpretable columns.
  feature_mode: sparse   # sparse | full
  # Lags for mediator pass-through (contract cadence), months
  mediator_lags: [2, 3]
  mediator_return_periods: [1, 3]
  gpr_lags: [0, 1]
  event_decay_half_life_months: 3.0
  # DGP: how strongly real mediator moves enter synthetic part prices
  commodity_pass_through: 0.35
  freight_pass_through: 0.12
  gpr_direct_pass_through: 0.02   # residual direct geo effect after mediators
  # Scenario shocks for the geoscenario stage
  scenario_freight_shocks: [-20, -10, 10, 20, 40]
  scenario_gpr_shocks: [25, 50, 100]
  scenario_duty_shocks: [5, 10]

# --- Foreign exchange -------------------------------------------------------
# Parts are invoiced in the assembly plant's currency (INR), but a large share
# of input cost is not. Two channels, two rates:
#   EUR/INR - direct import invoicing from European tier-1 suppliers
#   USD/INR - the commodity channel (steel, copper, crude are USD-quoted
#             regardless of where they are physically bought)
# Source is the ECB reference rate via Frankfurter; no API key required.
fx:
  api_base: https://api.frankfurter.app
  base_currency: INR           # currency parts are priced in
  pairs:
    - base: EUR
      quote: INR
      channel: import_invoicing
      fallback_rate: 90.0
    - base: USD
      quote: INR
      channel: commodity
      fallback_rate: 83.0
  # Months between an FX move and its appearance in part prices. Supply
  # contracts reprice quarterly and inventory buffers absorb the first shock,
  # so pass-through is neither instant nor complete.
  # Percentage moves in the foreign currency to simulate. Positive = rupee
  # weakens = imported input costs rise.
  scenario_shocks: [-10, -5, -2, 2, 5, 10]
  default_pass_through_lag: 2
  # Fraction of an FX move that ever reaches price, before category and vendor
  # modulation. Suppliers absorb some of it in margin.
  base_pass_through: 0.55

# --- SKU / part-price source ------------------------------------------------
# Production path: drop monthly PO / invoice lines at data/raw/purchase_orders.csv
# (see src/price_forecasting/po_ingest.py for columns). mode=auto uses that file
# when present; otherwise the synthetic generator runs (demo default).
sku:
  mode: auto   # auto | synthetic | purchase_orders
  purchase_orders_filename: purchase_orders.csv
  panel_filename: parts_prices.csv

# --- Material Cost Dashboard -----------------------------------------------
# Commercial baselines (optional): drop data/raw/commercial_baselines.csv
# (see commercial_baselines.example.csv). When matched, baselineMode becomes
# "file" and the demo banner soft-gates.
# Spend basis MUST match the main dashboard (basket / hierarchy / tree):
# sum of unit prices. Set volume_weight to annual_part_volume only when you
# intentionally want qty x price annual spend (will not match KPI basket).
material_cost:
  commercial_filename: commercial_baselines.csv
  nomination_month: null          # optional YYYY-MM override; else panel min / file
  sop_month: null                 # optional YYYY-MM override; else panel max / file
  volume_weight: none             # none | annual_part_volume | project_volume
  require_commercial: false

# --- Synthetic SKU panel (used when sku.mode is synthetic / auto without PO) -
generation:
  # 6 projects x 10 categories = 60 combinations; ~8 parts each. Enough that a
  # vendor supplying several categories on one programme actually appears in the
  # data, which is the relationship the drill-down exists to show.
  n_parts: 480
  history_months: 36          # 3 seasonal cycles so SARIMA(.,.,.)(.,.,.,12) is fittable
  focus_months: 12            # reports/plots headline the most recent year
  end_month: "2026-06"        # last month of history; aligns with BLS data availability
  n_anomaly_parts: 4
  # Part-level idiosyncratic drift, drawn per part (monthly, log space)
  drift_mu: 0.0015
  drift_sigma: 0.0020
  # AR(1) noise: phi controls volatility persistence, sigma its scale
  noise_phi: 0.45
  noise_sigma: 0.018
  missing_value_rate: 0.01    # deliberately injected gaps to exercise the cleaner

# --- Cleaning & features ----------------------------------------------------
preprocessing:
  max_ffill_gap: 2            # months; longer gaps stay NaN and are reported
  min_history_months: 18      # below this a part is routed to the fallback forecaster
  outlier_mad_threshold: 3.5  # rolling median-absolute-deviation z-score
  outlier_window: 7
  # Floor for the MAD scale, as a fraction of the local median price. Without
  # it, a quiet window drives MAD toward zero and every small wiggle scores as
  # an outlier. 2% of price level is the smallest move worth calling anomalous.
  outlier_min_scale_frac: 0.02
  winsorize_outliers: false   # flag them, do not erase them - breaks are signal
  lags: [1, 2, 3, 6, 12]
  rolling_windows: [3, 6]
  # FX pass-through is delayed by contract repricing and inventory buffers, so
  # the move that explains this month's price happened months ago. Supply a
  # ladder of lags and let the model find the delay per category.
  fx_lags: [1, 2, 3, 4, 6]
  fx_return_periods: [1, 3, 6, 12]
  # Geo / mediator lags mirror config.geo but can be overridden here if needed.
  # When absent, preprocessing falls back to config.geo.*

# --- Models -----------------------------------------------------------------
modeling:
  forecast_horizon: 1         # next-month price (ops loop); not a 6-month path
  validation_months: 1        # final month held out entirely
  test_months: 3              # evaluation window before validation
  # 'log_return' or 'level'. Trees cannot extrapolate: with 'level' every
  # prediction is capped by the largest price seen in training, so on an
  # upward-trending series the model systematically undershoots and the bias
  # grows with horizon. Predicting log(price[t+h]/price[t]) keeps the target
  # stationary and lets the reconstructed level rise freely.
  xgboost_target_mode: log_return
  sarima:
    order: [1, 1, 1]
    seasonal_order: [1, 1, 0, 12]
    fallback_order: [1, 1, 1]
    max_parts: 60             # SARIMA is fit per part; cap for POC runtime
  xgboost:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.85
    colsample_bytree: 0.85
    min_child_weight: 5
    reg_lambda: 1.0
    n_jobs: 4

# --- Ops loop (monthly retrain / weekly score) ------------------------------
# Catalogue all drivers → classify which affect prices → monthly retrain on the
# selected set → weekly score that publishes a 1-month-ahead forecast.
ops:
  retrain_cadence: monthly
  score_cadence: weekly
  mape_drift_alert_pp: 0.5          # alert if holdout MAPE worsens by this many pp
  psi_alert_threshold: 0.25         # population-stability index on selected features
  feature_selection:
    top_k: 25
    min_ablation_lift_pct: 0.05     # keep group if dropping it hurts MAPE by ≥ this
    run_ablation: true
    always_keep_prefixes:
      - price_lag_
      - fx_
      - cmd_matched
      - freight_ret

# --- Evaluation -------------------------------------------------------------
evaluation:
  backtest_folds: 3
  backtest_horizon: 1         # months predicted per fold (matches ops horizon)
  prediction_interval: 0.80   # empirical PI coverage for the ML model
  # Widen empirical residual quantiles until in-sample residual coverage meets
  # the nominal rate (conformal-style inflate). 1.0 = raw quantiles.
  interval_coverage_target: 0.80
  interval_max_inflate: 3.0
  # Simulated-future test: generate this many extra months, hide them, forecast
  # them blind, then reveal and score. Kept short to match 1-month ops horizon.
  future_test_months: 3

# --- Visualisation ----------------------------------------------------------
visualization:
  grid_parts: 9               # 3x3 side-by-side forecast panel
  dpi: 130
  figure_width: 15
  style: whitegrid
  palette: colorblind

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-8s | %(name)-28s | %(message)s"
  datefmt: "%H:%M:%S"
