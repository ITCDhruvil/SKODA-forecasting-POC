# ---------------------------------------------------------------------------
# Automotive spare parts price forecasting - POC configuration
#
# Every tunable lives here. Modules take a Config object; no magic numbers are
# embedded in the code itself.
# ---------------------------------------------------------------------------

project:
  name: automotive-parts-price-forecasting
  random_seed: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  reports: reports
  figures: reports/figures
  models: models

# --- Real-data anchor -------------------------------------------------------
# BLS public API v1 needs no registration key. CUUR0000SETC is the CPI for
# "Motor Vehicle Parts and Equipment" (US city average, not seasonally
# adjusted, 1982-84=100) - the closest real, monthly, publicly available price
# signal for this domain.
sourcing:
  bls_api_base: https://api.bls.gov/publicAPI/v1/timeseries/data
  series_id: CUUR0000SETC
  fallback_series_id: WPU141101      # PPI motor vehicle parts, used if primary is empty
  request_timeout_seconds: 45
  cache_ttl_days: 7
  # If the live fetch fails entirely we synthesise this trend so the pipeline
  # still runs offline. Annualised drift, applied monthly in log space.
  offline_annual_inflation: 0.035

# --- Foreign exchange -------------------------------------------------------
# Parts are invoiced in the assembly plant's currency (INR), but a large share
# of input cost is not. Two channels, two rates:
#   EUR/INR - direct import invoicing from European tier-1 suppliers
#   USD/INR - the commodity channel (steel, copper, crude are USD-quoted
#             regardless of where they are physically bought)
# Source is the ECB reference rate via Frankfurter; no API key required.
fx:
  api_base: https://api.frankfurter.app
  base_currency: INR           # currency parts are priced in
  pairs:
    - base: EUR
      quote: INR
      channel: import_invoicing
      fallback_rate: 90.0
    - base: USD
      quote: INR
      channel: commodity
      fallback_rate: 83.0
  # Months between an FX move and its appearance in part prices. Supply
  # contracts reprice quarterly and inventory buffers absorb the first shock,
  # so pass-through is neither instant nor complete.
  # Percentage moves in the foreign currency to simulate. Positive = rupee
  # weakens = imported input costs rise.
  scenario_shocks: [-10, -5, -2, 2, 5, 10]
  default_pass_through_lag: 2
  # Fraction of an FX move that ever reaches price, before category and vendor
  # modulation. Suppliers absorb some of it in margin.
  base_pass_through: 0.55

# --- Synthetic SKU panel ----------------------------------------------------
generation:
  # 6 projects x 10 categories = 60 combinations; ~8 parts each. Enough that a
  # vendor supplying several categories on one programme actually appears in the
  # data, which is the relationship the drill-down exists to show.
  n_parts: 480
  history_months: 36          # 3 seasonal cycles so SARIMA(.,.,.)(.,.,.,12) is fittable
  focus_months: 12            # reports/plots headline the most recent year
  end_month: "2026-06"        # last month of history; aligns with BLS data availability
  n_anomaly_parts: 4
  # Part-level idiosyncratic drift, drawn per part (monthly, log space)
  drift_mu: 0.0015
  drift_sigma: 0.0020
  # AR(1) noise: phi controls volatility persistence, sigma its scale
  noise_phi: 0.45
  noise_sigma: 0.018
  missing_value_rate: 0.01    # deliberately injected gaps to exercise the cleaner

# --- Cleaning & features ----------------------------------------------------
preprocessing:
  max_ffill_gap: 2            # months; longer gaps stay NaN and are reported
  min_history_months: 18      # below this a part is routed to the fallback forecaster
  outlier_mad_threshold: 3.5  # rolling median-absolute-deviation z-score
  outlier_window: 7
  # Floor for the MAD scale, as a fraction of the local median price. Without
  # it, a quiet window drives MAD toward zero and every small wiggle scores as
  # an outlier. 2% of price level is the smallest move worth calling anomalous.
  outlier_min_scale_frac: 0.02
  winsorize_outliers: false   # flag them, do not erase them - breaks are signal
  lags: [1, 2, 3, 6, 12]
  rolling_windows: [3, 6]
  # FX pass-through is delayed by contract repricing and inventory buffers, so
  # the move that explains this month's price happened months ago. Supply a
  # ladder of lags and let the model find the delay per category.
  fx_lags: [1, 2, 3, 4, 6]
  fx_return_periods: [1, 3, 6, 12]

# --- Models -----------------------------------------------------------------
modeling:
  forecast_horizon: 6         # months forecast beyond end of history
  validation_months: 2        # final months held out entirely
  test_months: 6              # evaluation window before validation
  # 'log_return' or 'level'. Trees cannot extrapolate: with 'level' every
  # prediction is capped by the largest price seen in training, so on an
  # upward-trending series the model systematically undershoots and the bias
  # grows with horizon. Predicting log(price[t+h]/price[t]) keeps the target
  # stationary and lets the reconstructed level rise freely.
  xgboost_target_mode: log_return
  sarima:
    order: [1, 1, 1]
    seasonal_order: [1, 1, 0, 12]
    fallback_order: [1, 1, 1]
    max_parts: 60             # SARIMA is fit per part; cap for POC runtime
  xgboost:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.85
    colsample_bytree: 0.85
    min_child_weight: 5
    reg_lambda: 1.0
    n_jobs: 4

# --- Evaluation -------------------------------------------------------------
evaluation:
  backtest_folds: 3
  backtest_horizon: 3         # months predicted per fold
  prediction_interval: 0.80   # empirical PI coverage for the ML model
  # Simulated-future test: generate this many extra months, hide them, forecast
  # them blind, then reveal and score. Gives a per-horizon error rate.
  future_test_months: 6

# --- Visualisation ----------------------------------------------------------
visualization:
  grid_parts: 9               # 3x3 side-by-side forecast panel
  dpi: 130
  figure_width: 15
  style: whitegrid
  palette: colorblind

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-8s | %(name)-28s | %(message)s"
  datefmt: "%H:%M:%S"
